<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring (Dorado) -->
  <circle cx="250" cy="250" r="235" stroke="url(#goldGrad)" stroke-width="8" fill="url(#blueGrad)"/>
  <circle cx="250" cy="250" r="215" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Rayos de Luz Divina de Fondo -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="250" y1="250" x2="250" y2="40"/>
    <line x1="250" y1="250" x2="398" y2="101"/>
    <line x1="250" y1="250" x2="460" y2="250"/>
    <line x1="250" y1="250" x2="398" y2="398"/>
    <line x1="250" y1="250" x2="250" y2="460"/>
    <line x1="250" y1="250" x2="101" y2="398"/>
    <line x1="250" y1="250" x2="40" y2="250"/>
    <line x1="250" y1="250" x2="101" y2="101"/>
  </g>

  <!-- Texto Circular Alrededor -->
  <path id="textCircleTop" d="M 85,250 A 165,165 0 0,1 415,250" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="4">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      ASAMBLEAS DE DIOS
    </textPath>
  </text>

  <path id="textCircleBottom" d="M 415,250 A 165,165 0 0,1 85,250" fill="none"/>
  <text font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="url(#goldGrad)" letter-spacing="5">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      1914 • PENTECOSTAL
    </textPath>
  </text>

  <!-- Llama de Fuego Pentecostal de Fondo -->
  <path d="M 250,110 C 230,150 200,180 200,225 C 200,265 225,290 250,290 C 275,290 300,265 300,225 C 300,180 270,150 250,110 Z" fill="url(#flameGrad)" opacity="0.85" filter="url(#shadow)"/>
  <path d="M 250,150 C 240,175 220,195 220,225 C 220,250 235,265 250,265 C 265,265 280,250 280,225 C 280,195 260,175 250,150 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Biblia Abierta en la Base -->
  <g filter="url(#shadow)">
    <!-- Páginas de la Biblia -->
    <path d="M 150,300 C 185,295 230,305 250,320 C 270,305 315,295 350,300 L 350,345 C 315,340 270,350 250,365 C 230,350 185,340 150,345 Z" fill="#ffffff"/>
    <path d="M 150,345 C 185,340 230,350 250,365 C 270,350 315,340 350,345 L 350,355 C 315,350 270,360 250,375 C 230,360 185,350 150,355 Z" fill="url(#goldGrad)"/>
    <!-- Líneas de Escritura -->
    <line x1="175" y1="315" x2="230" y2="318" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="175" y1="326" x2="225" y2="329" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="270" y1="318" x2="325" y2="315" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="275" y1="329" x2="325" y2="326" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- La Cruz Central -->
  <g filter="url(#shadow)">
    <!-- Brazo Vertical -->
    <rect x="242" y="180" width="16" height="135" rx="3" fill="#ffffff"/>
    <rect x="244" y="182" width="12" height="131" rx="2" fill="url(#goldGrad)"/>
    <!-- Brazo Horizontal -->
    <rect x="210" y="215" width="80" height="16" rx="3" fill="#ffffff"/>
    <rect x="212" y="217" width="76" height="12" rx="2" fill="url(#goldGrad)"/>
  </g>

  <!-- La Paloma Descendiendo (Espíritu Santo) -->
  <g filter="url(#shadow)">
    <!-- Cuerpo y Cabeza hacia abajo -->
    <path d="M 250,220 C 243,205 238,185 250,170 C 262,185 257,205 250,220 Z" fill="#ffffff"/>
    <!-- Ala Izquierda -->
    <path d="M 245,190 C 215,165 175,170 160,185 C 180,195 210,195 240,198 Z" fill="#ffffff"/>
    <!-- Ala Derecha -->
    <path d="M 255,190 C 285,165 325,170 340,185 C 320,195 290,195 260,198 Z" fill="#ffffff"/>
    <!-- Cola / Plumas Superiores -->
    <path d="M 246,170 C 242,150 250,140 250,140 C 250,140 258,150 254,170 Z" fill="#ffffff"/>
  </g>
</svg>
